<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Properties | Haven Estates (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="site-header"></div>
<main>
<div class="page"><h1>Properties</h1>
<form class="filters" role="search" onsubmit="return false">
<label>Search<input id="search" type="search" placeholder="Name, area or type"></label>
<label>Property type<select id="type"></select></label>
<label>Maximum price <output id="price-out"></output><input id="price" type="range" min="1000000" max="8000000" step="100000" value="8000000"></label>
<label>Sort by<select id="sort"><option value="featured">Featured</option><option value="asc">Price, low to high</option><option value="desc">Price, high to low</option></select></label>
<label class="check"><input id="saved-only" type="checkbox"> Show saved only</label></form>
<p id="count" aria-live="polite"></p><br><div class="grid" id="grid"></div></div>
</main>
<div id="site-footer"></div>
<script src="properties.js"></script><script src="main.js"></script><script src="filters.js"></script>
</body></html>
